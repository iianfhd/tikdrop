<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1030" />
  <meta name="color-scheme" content="dark light" />
  <meta name="referrer" content="no-referrer" />
  <title>Masuk · TikDrop</title>
  <link rel="stylesheet" href="/login.css" />
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="authTitle">
      <a class="auth-brand" href="/" aria-label="TikDrop">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#151a45"/><path d="M14 6h4v9h5l-7 8-7-8h5z" fill="#ff6a3d"/></svg>
        <span>tikdrop</span>
      </a>
      <h1 id="authTitle">Password akses</h1>
      <p class="auth-copy">Masukkan password untuk membuka TikDrop.</p>
      <form id="loginForm">
        <label for="accessPassword">Password</label>
        <input id="accessPassword" name="password" type="password" minlength="16" maxlength="1024" autocomplete="current-password" required autofocus />
        <p id="loginError" class="auth-error" role="status" aria-live="polite" hidden></p>
        <button id="loginButton" type="submit">Masuk</button>
      </form>
    </section>
  </main>
</body>
</html>
